version: "3.9"

# CyberShield AI — full stack (MySQL + FastAPI backend + React frontend)
# Quick start:
#   1. cp backend/.env.example backend/.env   (edit DB_PASSWORD to match below)
#   2. docker compose up --build
#   3. Open http://localhost:5173
#
# The backend automatically creates tables on first boot and the demo dataset
# can be seeded with: docker compose exec backend python seed_data.py

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: cybershield_ai
      MYSQL_USER: cybershield_user
      MYSQL_PASSWORD: change-this-password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prootpassword"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      APP_ENV: production
      DEBUG: "false"
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: cybershield_user
      DB_PASSWORD: change-this-password
      DB_NAME: cybershield_ai
      USE_SQLITE_FALLBACK: "false"
      ALLOWED_ORIGINS: "http://localhost:5173"
      SECRET_KEY: change-this-in-production
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  mysql_data:
